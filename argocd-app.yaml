apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nodejs-app-gitops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/TON_USERNAME/nodejs-k8s-gitops.git'
    targetRevision: HEAD
    path: k8s
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
