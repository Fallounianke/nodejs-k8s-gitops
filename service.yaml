apiVersion: v1
kind: Service
metadata:
  name: nodejs-app-service
spec:
  type: NodePort # ou LoadBalancer selon ton environnement Kubernetes
  selector:
    app: nodejs-app
  ports:
    - protocol: TCP
      port: 80         # Port exposé par le service
      targetPort: 3000 # Port sur lequel écoute l'application Node.js dans le pod
      nodePort: 30080  # Port accessible depuis l'extérieur sur tes nœuds

