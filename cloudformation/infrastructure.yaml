AWSTemplateFormatVersion: '2010-09-09'
Description: 'AWS Infrastructure for a Kubernetes Cluster'

# ==========================================
# PARAMETERS
# ==========================================

Parameters:

  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Existing EC2 SSH Key Pair

  AllowedAdminCIDR:
    Type: String
    Description: Public IP address authorized for SSH and Kubernetes API access
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/(3[0-2]|[12]?\d)$'

# ==========================================
# NETWORK INFRASTRUCTURE
# ==========================================

Resources:

  K8sVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: k8s-vpc

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: k8s-igw

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref K8sVPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref K8sVPC
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: k8s-public-subnet

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref K8sVPC
      Tags:
        - Key: Name
          Value: k8s-public-rt

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

# ==========================================
# SECURITY GROUP
# ==========================================

  K8sSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security Group for Kubernetes Cluster
      VpcId: !Ref K8sVPC

      SecurityGroupIngress:

        # SSH - Restricted to administrator IP
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AllowedAdminCIDR

        # Kubernetes API Server
        - IpProtocol: tcp
          FromPort: 6443
          ToPort: 6443
          CidrIp: !Ref AllowedAdminCIDR

        # Internal communication between cluster nodes
        - IpProtocol: -1
          CidrIp: 10.0.0.0/16

      Tags:
        - Key: Name
          Value: k8s-security-group

# ==========================================
# KUBERNETES CONTROL PLANE
# ==========================================

  K8sMasterNode:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro

      ImageId: resolve:ssm:/aws/service/canonical/ubuntu/server/22.04/stable/current/amd64/hvm/ebs-gp2/ami-id

      KeyName: !Ref KeyName
      SubnetId: !Ref PublicSubnet

      SecurityGroupIds:
        - !Ref K8sSecurityGroup

      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 20
            VolumeType: gp3

      Tags:
        - Key: Name
          Value: k8s-control-plane

# ==========================================
# KUBERNETES WORKER NODE
# ==========================================

  K8sWorkerNode1:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro

      ImageId: resolve:ssm:/aws/service/canonical/ubuntu/server/22.04/stable/current/amd64/hvm/ebs-gp2/ami-id

      KeyName: !Ref KeyName
      SubnetId: !Ref PublicSubnet

      SecurityGroupIds:
        - !Ref K8sSecurityGroup

      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 15
            VolumeType: gp3

      Tags:
        - Key: Name
          Value: k8s-worker-1

# ==========================================
# OUTPUTS
# ==========================================

Outputs:

  MasterPublicIP:
    Description: Public IP of Kubernetes Control Plane
    Value: !GetAtt K8sMasterNode.PublicIp

  Worker1PublicIP:
    Description: Public IP of Kubernetes Worker Node
    Value: !GetAtt K8sWorkerNode1.PublicIp

  VPCId:
    Description: Kubernetes VPC ID
    Value: !Ref K8sVPC

  PublicSubnetId:
    Description: Public Subnet ID
    Value: !Ref PublicSubnet
